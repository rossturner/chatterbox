server:
  host: "0.0.0.0"
  port: 8000
  workers: 1  # MUST be 1 for single model instance
  request_timeout: 30  # seconds
  busy_timeout: 1.0  # seconds to wait for lock
  
model:
  type: "multilingual"  # Use multilingual model for zero-shot voice cloning
  path: null  # Use HuggingFace default model
  device: "cuda"
  keep_warm: true  # Keep model warm between requests
  use_optimizations: true  # Enable torch.compile and other optimizations

generation:
  default_temperature: 0.8
  default_cfg_weight: 0.5
  max_text_length: 1000
  use_cuda_graphs: true

cache:
  enabled: true  # Enable single-slot conditional caching

performance:
  pin_memory: true  # Use pinned memory for transfers
  torch_compile: true  # Enable torch.compile for faster inference
  single_request_mode: true  # Optimize for single request processing